name: Build JARVIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find JARVIS ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: JARVIS ZIP not found in repository root"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "JARVIS_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract JARVIS ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -o -q "$JARVIS_ZIP" -d extracted

          echo "ZIP extracted successfully"
          find extracted -maxdepth 3 -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Find Android project
        run: |
          FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Android settings.gradle not found inside ZIP"
            exit 1
          fi

          DIR=$(dirname "$FILE")

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          echo "Android project verified"

      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f debug.keystore

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -s debug.keystore

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK-FINAL
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Fixed Source
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-FINAL-SOURCE
          path: extracted/
          if-no-files-found: error
