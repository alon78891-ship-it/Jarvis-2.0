name: Build JARVIS FINAL APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Find and extract Android project
      - name: Extract JARVIS Android project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          FOUND=false

          while IFS= read -r ZIP; do
            [ -n "$ZIP" ] || continue

            echo "Checking ZIP: $ZIP"

            rm -rf extracted/*
            unzip -q "$ZIP" -d extracted || continue

            SETTINGS=$(find extracted \
              -type f \
              \( -name "settings.gradle.kts" \
              -o -name "settings.gradle" \) \
              -print -quit)

            if [ -n "$SETTINGS" ]; then
              ROOT=$(dirname "$SETTINGS")

              if [ -f "$ROOT/app/src/main/AndroidManifest.xml" ] && \
                 { [ -f "$ROOT/app/build.gradle.kts" ] || \
                   [ -f "$ROOT/app/build.gradle" ]; }; then

                echo "JARVIS project found: $ROOT"
                echo "ROOT=$ROOT" >> "$GITHUB_ENV"

                FOUND=true
                break
              fi
            fi

          done < <(find . -maxdepth 3 -type f -name "*.zip")

          if [ "$FOUND" != "true" ]; then
            echo "ERROR: No ZIP containing a valid Android project was found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 7. Build APK
      - name: Build JARVIS Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$ROOT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      # 8. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "JARVIS APK BUILD SUCCESS"
          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-FINAL-APK
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 10. Upload build log even if build fails
      - name: Upload build error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-BUILD-ERROR-LOG
          path: build-log.txt
          if-no-files-found: ignore
