name: Build JARVIS APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract JARVIS ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: JARVIS ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -o -q "$ZIP" -d extracted

      - name: Find Android project
        run: |
          FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$(cd "$DIR" && pwd)" >> "$GITHUB_ENV"
          echo "Project: $DIR"


      - name: Apply JARVIS UI and weather fixes
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bar = Path("app/src/main/java/com/example/ui/components/VoiceControlBar.kt")
          s = bar.read_text()
          s = s.replace('QuickChip(label = "👥 Contacts", onClick = onOpenContacts, tag = "chip_contacts")',
                        'QuickChip(label = "📞 Contacts", onClick = onOpenContacts, tag = "chip_contacts")')
          s = s.replace('QuickChip(label = "⛅ Weather", onClick = { onSendCommand("weather") }, tag = "chip_weather")',
                        'QuickChip(label = "⛅ Weather", onClick = { onSendCommand("weather Dulalgram") }, tag = "chip_weather")')
          s = s.replace('QuickChip(label = "💡 Torch", onClick = { onSendCommand("flash on") }, tag = "chip_torch")\n            QuickChip(label = "🧮 25*40", onClick = { onSendCommand("calculate 25*40") }, tag = "chip_calc")',
                        'QuickChip(label = "💡 Torch ON", onClick = { onSendCommand("flash on") }, tag = "chip_torch_on")\n            QuickChip(label = "🔦 Torch OFF", onClick = { onSendCommand("flash off") }, tag = "chip_torch_off")')
          bar.write_text(s)

          weather = Path("app/src/main/java/com/example/data/api/ExternalServices.kt")
          ws = weather.read_text().replace('if (city.isBlank()) "Delhi"', 'if (city.isBlank()) "Dulalgram"')
          weather.write_text(ws)

          dialogs = Path("app/src/main/java/com/example/ui/components/JarvisDialogs.kt")
          ds = dialogs.read_text().replace('CommandItem("Weather", "weather Delhi", "Get live weather report")',
                                           'CommandItem("Weather", "weather Dulalgram", "Get live weather report")')
          dialogs.write_text(ds)

          # Make voice WhatsApp sending work through an explicit Accessibility permission.
          service = Path("app/src/main/java/com/example/service/WhatsAppAutomationService.kt")
          service.write_text(r'''package com.example.service

import android.accessibilityservice.AccessibilityService
import android.content.ComponentName
import android.content.Context
import android.content.Intent
import android.net.Uri
import android.os.Handler
import android.os.Looper
import android.provider.Settings
import android.view.accessibility.AccessibilityEvent
import android.view.accessibility.AccessibilityNodeInfo
import java.net.URLEncoder

class WhatsAppAutomationService : AccessibilityService() {
    private val handler = Handler(Looper.getMainLooper())
    private var attempts = 0

    override fun onServiceConnected() {
        super.onServiceConnected()
        instance = this
        launchPendingIfAny()
    }

    override fun onAccessibilityEvent(event: AccessibilityEvent?) {
        if (event?.packageName?.toString() == WHATSAPP_PACKAGE) {
            if (hasPendingRequest()) scheduleSendAttempt()
        }
    }

    override fun onInterrupt() = Unit

    override fun onDestroy() {
        handler.removeCallbacksAndMessages(SEND_TOKEN)
        if (instance === this) instance = null
        super.onDestroy()
    }

    private fun launchPendingIfAny() {
        val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
        val url = prefs.getString(KEY_URL, null) ?: return
        try {
            startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply {
                setPackage(WHATSAPP_PACKAGE)
                addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            })
            scheduleSendAttempt()
        } catch (_: Exception) {
            prefs.edit().remove(KEY_URL).apply()
        }
    }

    private fun scheduleSendAttempt() {
        handler.removeCallbacksAndMessages(SEND_TOKEN)
        attempts = 0
        handler.postAtTime({ tryClickSend() }, SEND_TOKEN, android.os.SystemClock.uptimeMillis() + 900)
    }

    private fun tryClickSend() {
        if (!hasPendingRequest()) return
        attempts++
        val root = rootInActiveWindow
        if (root != null && root.packageName?.toString() == WHATSAPP_PACKAGE) {
            val sendNode = findSendNode(root)
            if (sendNode != null && sendNode.isVisibleToUser && sendNode.isEnabled) {
                if (sendNode.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                    clearPending()
                    return
                }
            }
        }
        if (attempts < MAX_ATTEMPTS) {
            handler.postDelayed({ tryClickSend() }, 500)
        }
    }

    private fun findSendNode(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
        try {
            root.findAccessibilityNodeInfosByViewId(WHATSAPP_SEND_ID).firstOrNull()?.let { return it }
        } catch (_: Exception) {}

        val queue = ArrayDeque<AccessibilityNodeInfo>()
        queue.add(root)
        while (queue.isNotEmpty()) {
            val node = queue.removeFirst()
            val text = node.text?.toString()?.trim()?.lowercase().orEmpty()
            val desc = node.contentDescription?.toString()?.trim()?.lowercase().orEmpty()
            val id = node.viewIdResourceName?.lowercase().orEmpty()
            if ((text == "send" || desc == "send" || id.endsWith(":id/send")) && node.isClickable) {
                return node
            }
            for (i in 0 until node.childCount) {
                node.getChild(i)?.let { queue.add(it) }
            }
        }
        return null
    }

    private fun hasPendingRequest(): Boolean =
        getSharedPreferences(PREFS, Context.MODE_PRIVATE).contains(KEY_URL)

    private fun clearPending() {
        getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().remove(KEY_URL).apply()
        handler.removeCallbacksAndMessages(SEND_TOKEN)
    }

    companion object {
        private const val PREFS = "jarvis_whatsapp_automation"
        private const val KEY_URL = "pending_url"
        private const val WHATSAPP_PACKAGE = "com.whatsapp"
        private const val WHATSAPP_SEND_ID = "com.whatsapp:id/send"
        private const val MAX_ATTEMPTS = 20
        private val SEND_TOKEN = Any()
        private var instance: WhatsAppAutomationService? = null

        fun isEnabled(context: Context): Boolean {
            val expected = ComponentName(context, WhatsAppAutomationService::class.java).flattenToString()
            val enabled = Settings.Secure.getString(
                context.contentResolver,
                Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
            ).orEmpty()
            return enabled.split(':').any { it.equals(expected, ignoreCase = true) }
        }

        fun queueAndStart(context: Context, number: String, message: String): Boolean {
            var formatted = number.replace(" ", "").replace("-", "")
            if (!formatted.startsWith("+") && !formatted.startsWith("91") && formatted.length == 10) {
                formatted = "91" + formatted
            }
            formatted = formatted.removePrefix("+")
            val encodedMsg = URLEncoder.encode(message, "UTF-8")
            val url = "https://wa.me/" + formatted + "?text=" + encodedMsg

            context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                .edit()
                .putString(KEY_URL, url)
                .apply()

            val enabled = isEnabled(context)
            if (!enabled) {
                try {
                    context.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).apply {
                        addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    })
                } catch (_: Exception) {}
                return false
            }

            try {
                instance?.launchPendingIfAny()
                    ?: context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply {
                        setPackage(WHATSAPP_PACKAGE)
                        addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    })
            } catch (_: Exception) {}
            return true
        }
    }
}
''')

          xml = Path("app/src/main/res/xml/whatsapp_accessibility_service.xml")
          xml.write_text(r'''<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
    android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
    android:accessibilityFeedbackType="feedbackGeneric"
