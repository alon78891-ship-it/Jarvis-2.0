name: Build JARVIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find JARVIS ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: JARVIS ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "JARVIS_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract JARVIS ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -o -q "$JARVIS_ZIP" -d extracted

          echo "ZIP extracted successfully"

      - name: Find Android project
        run: |
          FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          DIR=$(dirname "$FILE")

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "settings.gradle.kts OK"
          elif [ -f settings.gradle ]; then
            echo "settings.gradle OK"
          else
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

          if [ -f app/build.gradle.kts ]; then
            echo "app/build.gradle.kts OK"
          elif [ -f app/build.gradle ]; then
            echo "app/build.gradle OK"
          else
            echo "ERROR: app build file missing"
            exit 1
          fi

      - name: Fix WhatsApp automation compile error
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/example/service/DeviceController.kt")
          s = p.read_text()

          if "fun isWhatsAppAutomationEnabled()" not in s:
              marker = "    fun sendWhatsApp(number: String, message: String): Boolean {"
              addition = "    fun isWhatsAppAutomationEnabled(): Boolean = WhatsAppAutomationService.isEnabled(context)\\n\\n"
              s = s.replace(marker, addition + marker, 1)

          s = s.replace("\\n", "\n")
          p.write_text(s)
          print("WhatsApp compile fix applied")
          PY

      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f debug.keystore

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          ls -lh debug.keystore

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK-FINAL
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Fixed Source
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-FINAL-SOURCE
          path: extracted/
          if-no-files-found: error
