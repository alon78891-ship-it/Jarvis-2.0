    }'''
          new_handle = '''    private suspend fun handleWhatsApp(c: String): CommandResult {
        if (c.contains(" to ")) {
            val parts = c.removePrefix("whatsapp ").split(" to ", limit = 2)
            val msg = parts[0].trim()
            val target = parts[1].trim()
            return sendWhatsAppTo(target, msg)
        }

        // Hindi/Hinglish voice form: "whatsapp Rohan ko hello bhejo"
        val afterWhatsApp = c.removePrefix("whatsapp ").trim()
        if (afterWhatsApp.contains(" ko ")) {
            val parts = afterWhatsApp.split(" ko ", limit = 2)
            val target = parts[0].trim()
            val msg = parts[1]
                .removeSuffix(" bhejo")
                .removeSuffix(" bhej do")
                .removeSuffix(" send karo")
                .removeSuffix(" send")
                .trim()
            if (target.isNotBlank() && msg.isNotBlank()) {
                return sendWhatsAppTo(target, msg)
            }
        }

        // Natural form: "Rohan ko WhatsApp pe hello bhejo"
        if (c.contains(" ko whatsapp ")) {
            val parts = c.split(" ko whatsapp ", limit = 2)
            val target = parts[0].trim()
            val msg = parts[1]
                .removePrefix("par ")
                .removePrefix("pe ")
                .removeSuffix(" bhejo")
                .removeSuffix(" bhej do")
                .removeSuffix(" send karo")
                .removeSuffix(" send")
                .trim()
            if (target.isNotBlank() && msg.isNotBlank()) {
                return sendWhatsAppTo(target, msg)
            }
        }

        val person = c.removePrefix("open whatsapp").removePrefix("whatsapp").replace("ko", "").replace("pe", "").trim()
        if (person.isNotBlank()) {
            val num = dao.getPhoneNumberByName(person) ?: person
            deviceController.openWhatsAppChat(num)
            return CommandResult("$person ka WhatsApp khol diya.", commandTag = "WHATSAPP")
        }
        deviceController.openApp("whatsapp")
        return CommandResult("WhatsApp khol diya.", commandTag = "WHATSAPP")
    }

    private suspend fun sendWhatsAppTo(target: String, message: String): CommandResult {
        val contactNum = dao.getPhoneNumberByName(target) ?: target
        val permissionReady = deviceController.isWhatsAppAutomationEnabled()
        deviceController.sendWhatsApp(contactNum, message)
        return if (permissionReady) {
            CommandResult("WhatsApp khol kar message automatically send kar raha hu.", commandTag = "WHATSAPP")
        } else {
            CommandResult(
                "Pehli baar JARVIS Accessibility permission Allow karein. Allow karte hi WhatsApp khulega aur message automatically send hoga.",
                commandTag = "WHATSAPP"
            )
        }
    }'''
          if old_handle in cs:
              cs = cs.replace(old_handle, new_handle)
          cs = cs.replace('return if (candidate.isNotBlank()) candidate else "Delhi"', 'return if (candidate.isNotBlank()) candidate else "Dulalgram"')
          commander.write_text(cs)

          print("JARVIS WhatsApp automation patch applied: Accessibility permission, voice message parsing, auto-open and auto-send.")
          PY

      - name: Fix JARVIS Android configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              '  alias(libs.plugins.google.services)\n',
              ''
          )

          s = s.replace(
              'import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy\n',
              ''
          )

          start = s.find('googleServices {')
          if start != -1:
              end = s.find('}', start)
              if end != -1:
                  s = s[:start] + s[end + 1:]

          s = s.replace(
              'compileSdk { version = release(36) { minorApiLevel = 1 } }',
              'compileSdk = 36'
          )

          p.write_text(s)

          # Fix keyboard/layout behavior in the Compose UI.
          main = Path("app/src/main/java/com/example/MainActivity.kt")
          ms = main.read_text()
          ms = ms.replace("import androidx.activity.enableEdgeToEdge\n", "")
          ms = ms.replace("        enableEdgeToEdge()\n", "")
          main.write_text(ms)

          bar = Path("app/src/main/java/com/example/ui/components/VoiceControlBar.kt")
          bs = bar.read_text()
          if "import androidx.compose.foundation.layout.imePadding" not in bs:
              bs = bs.replace(
                  "import androidx.compose.foundation.layout.height\n",
                  "import androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.imePadding\n"
              )
          marker = "            .padding(horizontal = 12.dp, vertical = 8.dp)\n"
          if marker in bs and ".imePadding()" not in bs:
              bs = bs.replace(
                  marker,
                  marker + "            .imePadding()\n",
                  1
              )
          bar.write_text(bs)
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f debug.keystore

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore created:"
          ls -lh debug.keystore

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace


      - name: Package fixed source ZIP
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f ../JARVIS-FIXED.zip
          zip -qr ../JARVIS-FIXED.zip . -x "app/build/*" ".gradle/*" "**/.gradle/*" "debug.keystore"
          ls -lh ../JARVIS-FIXED.zip


      - name: Upload fixed source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-FIXED-SOURCE
          path: ${{ github.workspace }}/JARVIS-FIXED.zip
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
