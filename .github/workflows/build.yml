''')

          manifest = Path("app/src/main/AndroidManifest.xml")
          ms = manifest.read_text()
          if "WhatsApp voice typing + automatic send" not in ms:
              marker = "        <!-- Notification action receiver for direct reply & controls -->"
              ms = ms.replace(marker, r'''        <!-- WhatsApp voice typing + automatic send (Accessibility permission) -->
        <service
            android:name=".service.WhatsAppAutomationService"
            android:label="JARVIS WhatsApp Automation"
