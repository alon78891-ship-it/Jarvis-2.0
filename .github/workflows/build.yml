name: Build JARVIS FINAL APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract JARVIS Android project
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          find . -maxdepth 2 -type f | sort | head -100

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No JARVIS Android ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP" -d android-project

          echo "Searching for Gradle project..."

          ROOT=$(find android-project \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            ROOT=$(find android-project \
              -type f \
              -name "settings.gradle" \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            find android-project -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Android project found at:"
          echo "$ROOT"

          echo "Checking required files..."

          test -f "$ROOT/settings.gradle.kts" \
            || test -f "$ROOT/settings.gradle"

          test -f "$ROOT/build.gradle.kts" \
            || test -f "$ROOT/build.gradle"

          test -f "$ROOT/app/build.gradle.kts" \
            || test -f "$ROOT/app/build.gradle"

          test -f "$ROOT/app/src/main/AndroidManifest.xml"

          echo "JARVIS Android project verified."

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build JARVIS APK
        run: |
          cd "$ROOT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "================================"
          echo "JARVIS APK BUILD SUCCESS"
          echo "================================"

          ls -lh "$APK"

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-FINAL-APK
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
