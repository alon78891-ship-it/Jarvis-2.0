name: Build JARVIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify JARVIS project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          echo "JARVIS Android project found"

      - name: Create debug keystore
        run: |
          rm -f debug.keystore

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -s debug.keystore

      - name: Build Debug APK
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK-FINAL
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Source
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-FINAL-SOURCE
          path: |
            app/
            gradle/
            settings.gradle.kts
            build.gradle.kts
            gradle.properties
            .env.example
            metadata.json
            README.md
            JARVIS-ALL-FEATURES-README.md
            FINAL-BUILD-NOTES.md
            .github/workflows/build.yml
          if-no-files-found: warn
