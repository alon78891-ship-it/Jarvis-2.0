name: Build JARVIS FINAL APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # 4. Install required Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Find JARVIS ZIP and extract it
      - name: Find and extract JARVIS Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for JARVIS Android ZIP..."
          echo "======================================"

          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP" -d android-project

          echo ""
          echo "Searching for Gradle project..."

          ROOT=$(find android-project \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit)

          if [ -n "$ROOT" ]; then
            ROOT=$(dirname "$ROOT")
          fi

          if [ -z "$ROOT" ]; then
            ROOT=$(find android-project \
              -type f \
              -name "settings.gradle" \
              -print -quit)

            if [ -n "$ROOT" ]; then
              ROOT=$(dirname "$ROOT")
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android Gradle project not found."
            echo ""
            echo "Extracted files:"
            find android-project -maxdepth 6 -type f | sort
            exit 1
          fi

          echo ""
          echo "Android project found:"
          echo "$ROOT"

          echo ""
          echo "Checking project files..."

          if [ ! -f "$ROOT/settings.gradle.kts" ] && \
             [ ! -f "$ROOT/settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "$ROOT/build.gradle.kts" ] && \
             [ ! -f "$ROOT/build.gradle" ]; then
            echo "ERROR: root build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "$ROOT/app/build.gradle.kts" ] && \
             [ ! -f "$ROOT/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "$ROOT/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi

          echo ""
          echo "JARVIS Android project verified."

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 7. Build APK
      - name: Build JARVIS Debug APK
        shell: bash
        run: |
          set -e

          cd "$ROOT"

          echo "======================================"
          echo "Building JARVIS APK..."
          echo "======================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 8. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"

          echo "======================================"
          echo "Checking APK..."
          echo "======================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            echo ""
            echo "Build output:"
            find "$ROOT/app/build" -type f | sort || true
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "JARVIS APK BUILD SUCCESS"
          echo "======================================"

          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-FINAL-APK
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
