name: Build JARVIS FINAL APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          FOUND=false

          while IFS= read -r ZIP; do
            [ -n "$ZIP" ] || continue
            echo "Checking: $ZIP"

            rm -rf extracted/*
            unzip -q "$ZIP" -d extracted || continue

            SETTINGS=$(find extracted -type f \
              \( -name "settings.gradle.kts" \
              -o -name "settings.gradle" \) \
              -print -quit)

            [ -n "$SETTINGS" ] || continue
            ROOT=$(dirname "$SETTINGS")

            if [ -f "$ROOT/app/src/main/AndroidManifest.xml" ] && \
               { [ -f "$ROOT/app/build.gradle.kts" ] || \
                 [ -f "$ROOT/app/build.gradle" ]; }; then
              echo "ROOT=$ROOT" >> "$GITHUB_ENV"
              echo "Android project found: $ROOT"
              FOUND=true
              break
            fi
          done < <(find . -maxdepth 3 -type f -name "*.zip" \
            ! -path "./extracted/*" | sort)

          if [ "$FOUND" != "true" ]; then
            echo "ERROR: No valid Android project ZIP found."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

      - name: Fix Android accessibility description resource
        shell: bash
        run: |
          set -e
          XML="$ROOT/app/src/main/res/xml/accessibility_service_config.xml"
          if [ -f "$XML" ]; then
            python3 - "$XML" "$ROOT/app/src/main/res/values/jarvis_build_strings.xml" <<'PY'
          import pathlib
          import sys

          xml_path = pathlib.Path(sys.argv[1])
          strings_path = pathlib.Path(sys.argv[2])
          content = xml_path.read_text(encoding="utf-8")
          bad = 'android:description="JARVIS authorized UI control service for user-requested navigation and automation."'
          good = 'android:description="@string/accessibility_service_description"'

          if bad in content:
              content = content.replace(bad, good)
              xml_path.write_text(content, encoding="utf-8")
              print("Fixed accessibility service description to use a string resource.")
          elif good in content:
              print("Accessibility description already uses a resource.")
          else:
              print("Description text differs; leaving XML unchanged.")
              print("Inspecting resource file for build diagnostics.")

          strings_path.parent.mkdir(parents=True, exist_ok=True)
          if not strings_path.exists():
              strings_path.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\\n'
                  '<resources>\\n'
                  '    <string name="accessibility_service_description">JARVIS authorized UI control service for user-requested navigation and automation.</string>\\n'
                  '</resources>\\n',
                  encoding="utf-8"
              )
          PY
          else
            echo "Accessibility config not found at expected path; listing XML resources."
            find "$ROOT/app/src/main/res" -type f -name "*.xml" -print
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build JARVIS APK
        shell: bash
        run: |
          set -o pipefail
          cd "$ROOT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "JARVIS APK BUILD SUCCESS"
          ls -lh "$APK"

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-FINAL-APK
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-BUILD-ERROR-LOG
          path: build-log.txt
          if-no-files-found: ignore
