                android:resource="@xml/whatsapp_accessibility_service" />
        </service>

''' + marker)
          manifest.write_text(ms)

          device = Path("app/src/main/java/com/example/service/DeviceController.kt")
          ds2 = device.read_text()
          old_send = '''    fun sendWhatsApp(number: String, message: String): Boolean {
        return try {
            var formatted = number.replace(" ", "").replace("-", "")
            if (!formatted.startsWith("+") && !formatted.startsWith("91") && formatted.length == 10) {
                formatted = "91" + formatted
            }
            formatted = formatted.removePrefix("+")
            val encodedMsg = URLEncoder.encode(message, "UTF-8")
            val url = "https://wa.me/$formatted?text=$encodedMsg"
            val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply {
                addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            }
            context.startActivity(intent)
            true
        } catch (e: Exception) {
            false
        }
    }'''
          new_send = '''    fun isWhatsAppAutomationEnabled(): Boolean =
        WhatsAppAutomationService.isEnabled(context)

    fun sendWhatsApp(number: String, message: String): Boolean =
        WhatsAppAutomationService.queueAndStart(context, number, message)'''
          if old_send in ds2:
              ds2 = ds2.replace(old_send, new_send)
          device.write_text(ds2)

          commander = Path("app/src/main/java/com/example/service/JarvisSmartCommander.kt")
          cs = commander.read_text()
          old_handle = '''    private suspend fun handleWhatsApp(c: String): CommandResult {
        if (c.contains(" to ")) {
            val parts = c.removePrefix("whatsapp ").split(" to ", limit = 2)
            val msg = parts[0].trim()
            val target = parts[1].trim()
            val contactNum = dao.getPhoneNumberByName(target) ?: target
            deviceController.sendWhatsApp(contactNum, msg)
            return CommandResult("WhatsApp message bhej raha hu.", commandTag = "WHATSAPP")
        }
        val person = c.removePrefix("open whatsapp").removePrefix("whatsapp").replace("ko", "").replace("pe", "").trim()
        if (person.isNotBlank()) {
            val num = dao.getPhoneNumberByName(person) ?: person
            deviceController.openWhatsAppChat(num)
            return CommandResult("$person ka WhatsApp khol diya.", commandTag = "WHATSAPP")
