name: Build JARVIS APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract JARVIS ZIP
        run: |
          mkdir -p extracted

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: JARVIS ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -o -q "$ZIP" -d extracted

      - name: Overlay latest JARVIS Web UI
        run: |
          UI=$(find web -maxdepth 1 -type f -name "index.html" | head -n 1)
          if [ -z "$UI" ]; then
            echo "ERROR: web/index.html not found"
            exit 1
          fi
          ASSET=$(find extracted -type d -path "*/app/src/main/assets" | head -n 1)
          if [ -z "$ASSET" ]; then
            echo "ERROR: Android assets directory not found"
            exit 1
          fi
          cp "$UI" "$ASSET/index.html"
          echo "Overlayed latest JARVIS UI into $ASSET/index.html"

      - name: Find Android project
        run: |
          FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          DIR=$(dirname "$FILE")

          echo "PROJECT_DIR=$(cd "$DIR" && pwd)" >> "$GITHUB_ENV"

          echo "Found project:"
          cd "$DIR"
          pwd

      - name: Fix Java/Kotlin JVM target
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if "compileOptions {" not in s:
              s = s.replace(
                  "    defaultConfig {",
                  '    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n    defaultConfig {'
              )
          if "kotlinOptions {" not in s:
              s = s.replace(
                  "\n}\n\ndependencies {",
                  '\n\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n}\n\ndependencies {'
              )
          p.write_text(s)
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Debug Keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

