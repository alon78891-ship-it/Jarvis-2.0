name: Build JARVIS APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract JARVIS ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: JARVIS ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -o -q "$ZIP" -d extracted

      - name: Find Android project
        run: |
          FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$(cd "$DIR" && pwd)" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - name: Fix JARVIS Android configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          # Remove Google Services plugin.
          s = s.replace(
              '  alias(libs.plugins.google.services)\n',
              ''
          )

          # Remove Google Services import.
          s = s.replace(
              'import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy\n',
              ''
          )

          # Remove Google Services configuration.
          start = s.find('googleServices {')
          if start != -1:
              end = s.find('}', start)
              if end != -1:
                  s = s[:start] + s[end + 1:]

          # Use normal Android 36 SDK instead of minor API 36.1.
          s = s.replace(
              'compileSdk { version = release(36) { minorApiLevel = 1 } }',
              'compileSdk = 36'
          )

          p.write_text(s)
          PY

          echo "----- Corrected app/build.gradle.kts -----"
          sed -n '1,100p' app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"

          sdkmanager --version

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
