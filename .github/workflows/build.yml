name: Build JARVIS APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract JARVIS ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: JARVIS ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -o -q "$ZIP" -d extracted

      - name: Find Android project
        run: |
          FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$(cd "$DIR" && pwd)" >> "$GITHUB_ENV"
          echo "Project: $DIR"


      - name: Apply JARVIS UI and weather fixes
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bar = Path("app/src/main/java/com/example/ui/components/VoiceControlBar.kt")
          s = bar.read_text()
          s = s.replace('QuickChip(label = "👥 Contacts", onClick = onOpenContacts, tag = "chip_contacts")',
                        'QuickChip(label = "📞 Contacts", onClick = onOpenContacts, tag = "chip_contacts")')
          s = s.replace('QuickChip(label = "⛅ Weather", onClick = { onSendCommand("weather") }, tag = "chip_weather")',
                        'QuickChip(label = "⛅ Weather", onClick = { onSendCommand("weather Dulalgram") }, tag = "chip_weather")')
          s = s.replace('QuickChip(label = "💡 Torch", onClick = { onSendCommand("flash on") }, tag = "chip_torch")\n            QuickChip(label = "🧮 25*40", onClick = { onSendCommand("calculate 25*40") }, tag = "chip_calc")',
                        'QuickChip(label = "💡 Torch ON", onClick = { onSendCommand("flash on") }, tag = "chip_torch_on")\n            QuickChip(label = "🔦 Torch OFF", onClick = { onSendCommand("flash off") }, tag = "chip_torch_off")')
          bar.write_text(s)

          weather = Path("app/src/main/java/com/example/data/api/ExternalServices.kt")
          ws = weather.read_text().replace('if (city.isBlank()) "Delhi"', 'if (city.isBlank()) "Dulalgram"')
          weather.write_text(ws)

          dialogs = Path("app/src/main/java/com/example/ui/components/JarvisDialogs.kt")
          ds = dialogs.read_text().replace('CommandItem("Weather", "weather Delhi", "Get live weather report")',
                                           'CommandItem("Weather", "weather Dulalgram", "Get live weather report")')
          dialogs.write_text(ds)

          print("JARVIS fixes applied: Contacts, Dulalgram Weather, Torch ON/OFF, removed 25*40 quick chip.")
          PY

      - name: Fix JARVIS Android configuration
      - name: Fix JARVIS Android configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              '  alias(libs.plugins.google.services)\n',
              ''
          )

          s = s.replace(
              'import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy\n',
              ''
          )

          start = s.find('googleServices {')
          if start != -1:
              end = s.find('}', start)
              if end != -1:
                  s = s[:start] + s[end + 1:]

          s = s.replace(
              'compileSdk { version = release(36) { minorApiLevel = 1 } }',
              'compileSdk = 36'
          )

          p.write_text(s)

          # Fix keyboard/layout behavior in the Compose UI.
          main = Path("app/src/main/java/com/example/MainActivity.kt")
          ms = main.read_text()
          ms = ms.replace("import androidx.activity.enableEdgeToEdge\n", "")
          ms = ms.replace("        enableEdgeToEdge()\n", "")
          main.write_text(ms)

          bar = Path("app/src/main/java/com/example/ui/components/VoiceControlBar.kt")
          bs = bar.read_text()
          if "import androidx.compose.foundation.layout.imePadding" not in bs:
              bs = bs.replace(
                  "import androidx.compose.foundation.layout.height\n",
                  "import androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.imePadding\n"
              )
          marker = "            .padding(horizontal = 12.dp, vertical = 8.dp)\n"
          if marker in bs and ".imePadding()" not in bs:
              bs = bs.replace(
                  marker,
                  marker + "            .imePadding()\n",
                  1
              )
          bar.write_text(bs)
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f debug.keystore

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore created:"
          ls -lh debug.keystore

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace


      - name: Package fixed source ZIP
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f ../JARVIS-FIXED.zip
          zip -qr ../JARVIS-FIXED.zip . -x "app/build/*" ".gradle/*" "**/.gradle/*" "debug.keystore"
          ls -lh ../JARVIS-FIXED.zip


      - name: Upload fixed source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-FIXED-SOURCE
          path: ${{ env.PROJECT_DIR }}/../JARVIS-FIXED.zip
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
